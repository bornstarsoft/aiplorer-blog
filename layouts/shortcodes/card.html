{{- $href := .Get "href" -}}
{{- $title := .Get "title" -}}
{{- $label := .Get "label" -}}
<a class="aiplorer-card" href="{{ $href | relURL }}" aria-label="{{ $title }}">
  {{ with $label }}<span class="aiplorer-card__label">{{ . }}</span>{{ end }}
  <h3 class="aiplorer-card__title">{{ $title }}</h3>
  <div class="aiplorer-card__body">{{ .Inner | markdownify }}</div>
</a>
