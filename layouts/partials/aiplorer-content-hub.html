{{- $reviewedPages := where (where .RegularPages "Params.reviewStatus" "reviewed") "Draft" false -}}
<article class="aiplorer-content-hub aiplorer-content-hub--compact">
  <header class="aiplorer-shell aiplorer-explorer__title">
    <div>
      <h1>{{ .Title }} <span>{{ len $reviewedPages }} articles</span></h1>
      <p>{{ .Params.description }}</p>
    </div>
    <a href="/ai-tools/tools/">Browse tools <span aria-hidden="true">&rarr;</span></a>
  </header>
  <section class="aiplorer-content-hub__content" id="content-hub-start" aria-label="{{ .Title }}">
    <div class="aiplorer-shell"><div class="aiplorer-content-hub__body">{{ .Content }}</div></div>
  </section>
</article>
